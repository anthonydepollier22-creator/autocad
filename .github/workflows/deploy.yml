name: Déploiement GitHub Pages

# Publie l'application statique ÉlectriCAD sur GitHub Pages.
# Le site sera accessible à : https://<utilisateur>.github.io/<dépôt>/

on:
  push:
    branches:
      - claude/gallant-ptolemy-4hp9vr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Préparation de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
