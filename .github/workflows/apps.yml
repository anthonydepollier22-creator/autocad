name: Applications à télécharger

# Construit ÉlectriCAD pour Windows, macOS, Linux et Android, puis publie une
# release GitHub. Les fichiers gardent toujours le même nom : le site pointe
# vers https://github.com/<dépôt>/releases/latest/download/<fichier>.
# Nouvelle version : augmenter "version" dans desktop/package.json.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/gallant-ptolemy-4hp9vr
    paths:
      - desktop/**
      - mobile/**
      - tools/**
      - .github/workflows/apps.yml

permissions:
  contents: write

concurrency:
  group: apps
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node tests/run.js

  desktop:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Dépendances
        run: npm ci --no-audit --no-fund
      - name: Construction (${{ runner.os }})
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  android:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm ci --no-audit --no-fund
      - name: Projet Android (Capacitor)
        run: |
          npm run web
          npx cap add android
          npm run icons
          npx cap sync android
      - name: Version
        run: |
          V=$(node -p "require('../desktop/package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Signature (clé stable, pour installer les mises à jour par-dessus)
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
      - name: Compilation de l'APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Nom du fichier
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ElectriCAD-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: mobile/ElectriCAD-Android.apk

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ÉlectriCAD ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: out/*
          body: |
            Éditeur, simulateur et visualisation 3D de schémas et d’installations électriques — **fonctionne entièrement hors ligne**.

            | Système | Fichier |
            |---|---|
            | Windows 10 / 11 | **ElectriCAD-Windows-Setup.exe** |
            | macOS, puce Apple (M1 → M4) | **ElectriCAD-macOS-arm64.dmg** |
            | macOS, processeur Intel | **ElectriCAD-macOS-x64.dmg** |
            | Linux | **ElectriCAD-Linux.AppImage** (rendre exécutable) ou **ElectriCAD-Linux.deb** |
            | Android 7 et plus | **ElectriCAD-Android.apk** |

            **Première ouverture** — les applications ne sont pas signées par un éditeur reconnu :
            - Windows : « Windows a protégé votre ordinateur » → *Informations complémentaires* → *Exécuter quand même*.
            - macOS : ouvrir le `.dmg`, glisser ÉlectriCAD dans Applications, puis clic droit sur l’app → *Ouvrir* (ou Réglages → Confidentialité et sécurité → *Ouvrir quand même*).
            - Android : autoriser l’installation d’applications inconnues pour le navigateur ou le gestionnaire de fichiers.

            Sans rien installer : l’application web, installable depuis le navigateur — https://anthonydepollier22-creator.github.io/autocad/
